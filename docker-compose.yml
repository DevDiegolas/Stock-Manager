services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stockmanager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-stockmanager}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stockmanager}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://stockmanager:changeme@db:5432/stockmanager?sslmode=disable}
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-random-secret-key}
      SERVER_PORT: ${SERVER_PORT:-8080}
      UPLOAD_DIR: ${UPLOAD_DIR:-/data/uploads}
    volumes:
      - backend_uploads:/data/uploads
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3000:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/tsconfig.json:/app/tsconfig.json
      - ./frontend/tailwind.config.js:/app/tailwind.config.js
      - ./frontend/postcss.config.js:/app/postcss.config.js
    depends_on:
      - backend
    restart: unless-stopped

  dbgate:
    image: dbgate/dbgate:latest
    ports:
      - "3100:3000"
    volumes:
      - dbgate_data:/root/.dbgate
    depends_on:
      - db
    restart: unless-stopped

volumes:
  pgdata:
  dbgate_data:
  backend_uploads:
